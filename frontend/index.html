<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="https://openlayers.org/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Using OpenLayers with Vite</title>
  </head>
  <body>
    <div id="map"></div>

    <!-- 可收起面板 -->
    <div id="panel-container" class="expanded">
      <div id="panel-header">
        <h3>信息面板</h3>
        <button id="toggle-panel">▼</button>
      </div>
      <div id="panel-content">
        <!-- 标签页导航 -->
        <div class="tab-navigation">
          <button id="layers-tab-btn" class="tab-btn active" data-tab="layers">地图图层</button>
          <button id="building-tab-btn" class="tab-btn" data-tab="building">建筑信息</button>
        </div>

        <!-- 标签页内容 -->
        <div class="tab-content">
          <!-- 地图图层标签页 -->
          <div id="layers-tab" class="tab-pane active">
            <div id="layers-list">
              <!-- 图层列表 -->
            </div>
          </div>

          <!-- 建筑图层信息标签页 -->
          <div id="building-tab" class="tab-pane">
            <table id="jmd-table">
              <thead>
                <tr>
                  <th>id</th>
                  <th>名称</th>
                </tr>
              </thead>
              <tbody id="jmd-table-body">
                <!-- 动态填充数据 -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
