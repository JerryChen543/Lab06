<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>WebGIS 实验六</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <!-- 全屏地图 -->
  <div id="map"></div>

  <!-- 悬浮工具栏 -->
  <div id="toolbar">
    <button id="btnBrowse">浏览</button>
    <button id="btnCreate">新建</button>
    <button id="btnEdit">编辑</button>
    <button id="btnEditSave">完成编辑</button>
    <button id="btnDelete">删除</button>


  </div>

  <!-- 悬浮面板 -->
  <div id="panel-container">
    <div id="panel-header">图层与浏览</div>
    <div id="panel-content">
      <div id="layers-list"></div>

      <table id="buildingTable" style="display:none;">
        <thead>
          <tr>
            <th>ID</th>
            <th>建筑名称</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
